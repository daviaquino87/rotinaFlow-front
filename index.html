<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover is required for env(safe-area-inset-*) to resolve to
      non-zero values on iOS — without it, every safe-area CSS rule in the app
      is silently inert, even in a standalone PWA on a notched iPhone.
      maximum-scale is intentionally omitted: capping it disables pinch-zoom,
      which fails WCAG 1.4.4 (users must be able to zoom text up to 200%).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>rotinaFlow - Organizador Inteligente</title>
    <meta
      name="description"
      content="Descreva seus objetivos e deixe a IA montar uma rotina semanal personalizada, sincronizada com seu Google Agenda em segundos."
    />
    <link rel="canonical" href="https://app.rotinaflow.com.br/" />

    <!-- Open Graph / social sharing (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="rotinaFlow" />
    <meta property="og:title" content="rotinaFlow - Organizador Inteligente" />
    <meta
      property="og:description"
      content="Descreva seus objetivos e deixe a IA montar uma rotina semanal personalizada, sincronizada com seu Google Agenda em segundos."
    />
    <meta property="og:url" content="https://app.rotinaflow.com.br/" />
    <meta property="og:image" content="https://app.rotinaflow.com.br/opengraph.jpg" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="rotinaFlow - Organizador Inteligente" />
    <meta
      name="twitter:description"
      content="Descreva seus objetivos e deixe a IA montar uma rotina semanal personalizada, sincronizada com seu Google Agenda em segundos."
    />
    <meta name="twitter:image" content="https://app.rotinaflow.com.br/opengraph.jpg" />

    <!--
      Content Security Policy (CSP)
      Browsers ignore the `frame-ancestors` and `sandbox` directives when a CSP
      is delivered via <meta> (they only take effect as a real HTTP response
      header) — so clickjacking protection is enforced as a real header via
      vercel.json instead. This meta tag covers everything else CSP can do
      client-side as defence-in-depth.
      - script-src 'self'           : only load scripts from the same origin
      - style-src 'unsafe-inline'   : required by Tailwind CSS v4 inline style generation
      - connect-src 'self' https:   : allow API calls to same origin + HTTPS endpoints
      - img-src data: https:        : allow data URIs (base64 images) and HTTPS sources
      - font-src https://fonts.gstatic.com: Google Fonts only
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https:;
        connect-src 'self' https:;
        base-uri 'self';
        form-action 'self';
      "
    />

    <!-- Prevents MIME-type sniffing attacks -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- Controls referrer information sent in requests -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="icon" type="image/png" href="/images/icon-192.png" />
    <!-- The web app manifest is generated by vite-plugin-pwa (see vite.config.ts)
         and injected automatically — no manual <link rel="manifest"> here. -->
    <meta name="theme-color" content="#c904bc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="rotinaFlow" />
    <link rel="apple-touch-icon" href="/images/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
